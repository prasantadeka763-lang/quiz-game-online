<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Online Quiz Game</title>
    <script src="https://socket.io"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; gap: 20px; justify-content: center; }
        .container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        .hidden { display: none; }
        h2 { color: #333; margin-top: 0; }
        input[type="text"] { width: 93%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; }
        button { background-color: #007BFF; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .option-btn { background-color: #f8f9fa; color: #333; border: 2px solid #e2e8f0; margin-bottom: 10px; text-align: left; transition: all 0.2s; }
        .option-btn:hover { background-color: #e2e8f0; border-color: #cbd5e1; }
        .leaderboard-box { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 250px; }
        ul { list-style: none; padding: 0; }
        li { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .progress { color: #666; font-size: 14px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <!-- Main Game Container -->
    <div class="container">
        <!-- Auth Screen -->
        <div id="auth-screen">
            <h2>Join Online Quiz</h2>
            <input type="text" id="username-input" placeholder="Enter your username..." autocomplete="off">
            <button onclick="joinGame()">Enter Lobby</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden">
            <div class="progress">Question <span id="q-current">1</span> of <span id="q-total">3</span></div>
            <h3 id="question-text">Loading question...</h3>
            <div id="options-container"></div>
        </div>

        <!-- End Screen -->
        <div id="end-screen" class="hidden">
            <h2>Quiz Complete! 🎉</h2>
            <p>Your Final Score: <strong id="final-score-val">0</strong> points</p>
            <button onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <!-- Live Leaderboard Container -->
    <div class="leaderboard-box">
        <h3>Live Leaderboard 🏆</h3>
        <ul id="leaderboard-list">
            <li><span style="color:#999">No active players</span></li>
        </ul>
    </div>

    <script>
        const socket = io();
        let myUsername = "";
        let currentQuestionId = null;

        function joinGame() {
            const input = document.getElementById('username-input').value.trim();
            if(!input) return alert("Please enter a valid username!");
            myUsername = input;
            
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            
            socket.emit('join_game', { username: myUsername });
        }

        socket.on('next_question', (data) => {
            currentQuestionId = data.question_data.id;
            document.getElementById('q-current').innerText = data.question_num;
            document.getElementById('q-total').innerText = data.total_questions;
            document.getElementById('question-text').innerText = data.question_data.question;
            
            const container = document.getElementById('options-container');
            container.innerHTML = ""; // Clear options
            
            data.question_data.options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = "option-btn";
                btn.innerText = option;
                btn.onclick = () => sendAnswer(option);
                container.appendChild(btn);
            });
        });

        function sendAnswer(selectedOption) {
            socket.emit('submit_answer', {
                username: myUsername,
                answer: selectedOption,
                question_id: currentQuestionId
            });
        }

        socket.on('update_leaderboard', (data) => {
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = "";
            data.leaderboard.forEach(player => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${player.name}</span><strong>${player.score} pts</strong>`;
                list.appendChild(li);
            });
        });

        socket.on('game_over', (data) => {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('hidden');
            document.getElementById('final-score-val').innerText = data.final_score;
        });
    </script>
</body>
</html>
